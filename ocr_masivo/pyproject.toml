[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-masivo-local"
version = "1.0.0"
description = "OCR local reanudable para lotes de PDF"
requires-python = ">=3.11"
dependencies = ["ocrmypdf>=17,<18", "PyMuPDF>=1.25,<2", "rich>=13,<15", "pikepdf>=9,<11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
calibracion = ["opencv-python-headless>=4.10,<6"]

[project.scripts]
ocr-masivo = "ocr_masivo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ocr_masivo.calibration" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
