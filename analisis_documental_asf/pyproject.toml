[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analisis-documental-asf"
version = "0.1.0"
description = "Catálogo local y trazabilidad de documentos con OCR"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.25,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
analisis-asf = "analisis_documental_asf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
